<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>

  <!-- Estilos y Scripts Compartidos -->
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/utileria.js" defer></script>
</head>
<body>

  <div class="card-container">
    <div class="card-header">
      <h2>Crear Cuenta</h2>
      <p>Llena el formulario con tus datos personales</p>
    </div>

    <!-- Caja de notificaciones -->
    <div id="alerta-box" class="alerta oculta"></div>

    <form id="registro-form" novalidate>
      
      <!-- Campos: Nombre y Apellido -->
      <div class="row-dos-columnas">
        <div class="input-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej. Lisandro" autocomplete="given-name">
          <span class="error-msg" id="error-nombre"></span>
        </div>

        <div class="input-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" placeholder="Ej. Lopezgit" autocomplete="family-name">
          <span class="error-msg" id="error-apellido"></span>
        </div>
      </div>

      <!-- Campo: Correo Electrónico -->
      <div class="input-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com" autocomplete="email">
        <span class="error-msg" id="error-correo"></span>
      </div>

      <!-- Campo: Fecha de Nacimiento -->
      <div class="input-group">
        <label for="fecha-nacimiento">Fecha de Nacimiento</label>
        <input type="date" id="fecha-nacimiento">
        <span class="error-msg" id="error-fecha"></span>
      </div>

      <!-- Campo: Contraseña con checklist -->
      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="btn-toggle-eye" id="toggle-password" title="Mostrar/Ocultar contraseña">👁️</button>
        </div>
        <span class="error-msg" id="error-password"></span>

        <!-- Requisitos visuales -->
        <div class="requisitos-lista">
          <p class="req-titulo">Requisitos obligatorios:</p>
          <ul>
            <li id="req-min8">• Mínimo 8 caracteres</li>
            <li id="req-mayus">• Una letra mayúscula</li>
            <li id="req-minus">• Una letra minúscula</li>
            <li id="req-num">• Al menos un número</li>
            <li id="req-especial">• Un carácter especial (!@#$%^&*)</li>
          </ul>
        </div>
      </div>

      <button type="submit" class="btn-submit">Registrarse</button>
    </form>

    <div class="card-footer">
      <span>¿Ya tienes una cuenta?</span>
      <a href="login.html" class="link-button">Inicia sesión</a>
    </div>
  </div>
    
  </script>
</body>
</html>
