<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Estilos y Scripts Compartidos -->
  <link rel="stylesheet" href="styles.css">
  <script src="validaciones.js" defer></script>
</head>
<body>

  <div class="card-container">
    <div class="card-header">
      <h2>Iniciar Sesión</h2>
      <p>Accede con tu correo y contraseña registrados</p>
    </div>

    <!-- Caja de notificaciones -->
    <div id="alerta-box" class="alerta oculta"></div>

    <form id="login-form" novalidate>
      
      <!-- Campo: Correo -->
      <div class="input-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com" autocomplete="email">
        <span class="error-msg" id="error-correo"></span>
      </div>

      <!-- Campo: Contraseña -->
      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="btn-toggle-eye" id="toggle-password" title="Mostrar/Ocultar contraseña">👁️</button>
        </div>
        <span class="error-msg" id="error-password"></span>
      </div>

      <button type="submit" class="btn-submit">Ingresar</button>
    </form>

    <div class="card-footer">
      <span>¿Aún no tienes cuenta?</span>
      <a href="registro.html" class="link-button">Regístrate aquí</a>
    </div>
  </div>

</body>
</html>
